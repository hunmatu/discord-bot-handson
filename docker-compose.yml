version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 開発時にコードの変更を反映させたい場合は以下をアンコメント
      # - ./src:/app/src:ro
    environment:
      - NODE_ENV=production
    # ヘルスチェック（オプション）
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
